name: Teleports
version: 1.1.5
main: com.varestorm.plugins.teleports.Application
api-version: 1.18
authors: [Rob_Varestorm]
description: Teleport plugin
prefix: TP
website: varestorm.com
commands:
  spawn:
    usage: /spawn
  bed:
    usage: /bed
  anchor:
    usage: /anchor
  back:
    usage: /back
  home:
    usage: /home
  sethome:
    usage: /sethome
  tp:
    usage: /tp [action] [name]
    aliases: [ teleport ]
    description: Used to teleport to certain locations.
  tpp:
    usage: /tpp [action] [player]
    aliases: [ teleportplayer, tpa ]
    description: Used to teleport to other players.
permissions:
  op:
    default: op
